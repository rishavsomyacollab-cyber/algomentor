version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: algomentor_postgres
    environment:
      POSTGRES_DB: algomentor
      POSTGRES_USER: algomentor
      POSTGRES_PASSWORD: algomentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algomentor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
